<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <script src="/static/js/htmx.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" hx-get="/" hx-target="#content" hx-push-url="true">Jiachen Wang</a>
    {{template "nav.html" .}}
  </header>

  <section id="hero">
    <canvas id="canvas" width="800" height="450" tabindex="-1"></canvas>
    <div class="hero-copy">
      <h1>Personal Gallery</h1>
      <p>A game-like portfolio built with raylib, running live in your browser via WebAssembly.</p>
    </div>
  </section>

  <main id="content">
    {{block "content" .Data}}{{end}}
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Jiachen Wang</p>
  </footer>

  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      // The page and the WASM artifacts don't share a directory (this page is
      // served from "/", the build output from "/static/wasm/"), so relative
      // asset lookups (the --preload-file .data package, in particular) need
      // to be pointed explicitly at the artifacts' own directory.
      locateFile: function (path) {
        return '/static/wasm/' + path;
      },
    };
  </script>
  <script src="/static/wasm/personal_gallery.js"></script>
</body>
</html>
