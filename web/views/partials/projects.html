{{define "content"}}
<section class="projects">
  <h2>Projects</h2>
  <div class="project-grid">
    {{range .}}
    <article class="project-card">
      <h3>{{.Title}}</h3>
      <p>{{.Description}}</p>
      {{if .URL}}<a href="{{.URL}}" target="_blank" rel="noopener">View &rarr;</a>{{end}}
    </article>
    {{end}}
  </div>
</section>
{{end}}
